# Netlify detects Next.js and applies its Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# The waitlist form is declared in public/__forms.html so Netlify Forms can
# register it at deploy time. Keep that file out of search results.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"
